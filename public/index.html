<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeatherGPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <header class="top">
    <a class="brand" href="/">WeatherGPT</a>
    <div class="search">
      <input id="q" type="search" placeholder="Search for a city" autocomplete="off" aria-label="Search for a city">
      <ul id="results" class="results" hidden></ul>
    </div>
    <button id="locate" class="btn" type="button">Use my location</button>
    <div class="toggle" role="group" aria-label="Units">
      <button type="button" data-units="metric">°C</button>
      <button type="button" data-units="imperial">°F</button>
    </div>
  </header>

  <main>
    <section id="empty" class="empty">
      <h1 id="empty-title">Finding your location…</h1>
      <p id="empty-text">Allow location access to see the weather where you are.</p>
    </section>

    <p id="error" class="error" hidden></p>
    <p id="notice" class="notice" hidden></p>

    <div id="view" hidden>
      <div class="lead">
        <section class="now">
          <p id="place" class="place"></p>
          <p class="temp"><span id="temp"></span><span id="deg" class="deg"></span></p>
          <p id="cond" class="cond"></p>
          <dl class="facts">
            <div><dt>Feels like</dt><dd id="feels"></dd></div>
            <div><dt>Humidity</dt><dd id="humidity"></dd></div>
            <div><dt>Wind</dt><dd id="wind"></dd></div>
          </dl>
        </section>
        <section class="summary">
          <h2>Summary</h2>
          <p id="summary" class="summary-text"></p>
          <p id="source" class="source"></p>
        </section>
      </div>

      <section class="panel">
        <h2>Next 24 hours</h2>
        <div class="chart"><canvas id="chart"></canvas></div>
      </section>

      <section class="panel">
        <h2>7-day forecast</h2>
        <ul id="days" class="days"></ul>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/effects.js?v=3"></script>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
